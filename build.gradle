plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.0.80'
}

version = '1.0.0'
group = 'com.kazuskot.professionclasses'

base {
    archivesName = 'profession-classes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    version = '1.21.1'
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.87'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title': 'Profession Classes',
            'Specification-Vendor': 'kazuskot',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'kazuskot',
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
